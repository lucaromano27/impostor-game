    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --bg:        #0d1117;
      --surface:   #161b27;
      --surface2:  #1e2535;
      --border:    rgba(255,255,255,0.07);
      --border2:   rgba(255,255,255,0.13);

      --red-border:rgba(248,113,113,0.25);
      --green:     #4ade80;
      --green-bg:  rgba(74,222,128,0.08);
      --green-border:rgba(74,222,128,0.2);
      --blue:      #60a5fa;
      --blue-bg:   rgba(96,165,250,0.1);
      --blue-border:rgba(96,165,250,0.25);
      --text:      #e8e4d9;
      --muted:     rgba(232,228,217,0.45);
      --radius:    10px;
      --radius-sm: 6px;
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    #root { width: 100%; max-width: 480px; }

    /* ── Typography ─────────────────────────────────────────────────── */
    h1 { font-size: 28px; font-weight: 600; color: var(--gold); letter-spacing: -0.5px; margin-bottom: 4px; }
    h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .muted { font-size: 13px; color: var(--muted); }
    .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }

    /* ── Card ───────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
    }
    .card-top {
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.4;
      margin: -24px -24px 24px;
    }

    /* ── Inputs ─────────────────────────────────────────────────────── */
    input[type="text"] {
      display: block;
      width: 100%;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 10px;
    }
    input[type="text"]:focus { border-color: var(--border2); }
    input[type="text"]::placeholder { color: var(--muted); }

    /* ── Buttons ────────────────────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: 11px 18px;
      border-radius: var(--radius-sm);
      border: 0.5px solid var(--border2);
      background: transparent;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
      margin-bottom: 8px;
      text-align: left;
    }
    .btn:hover:not(:disabled) { background: var(--surface2); }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: var(--gold);
      color: #0d1117;
      border-color: transparent;
      font-weight: 600;
      text-align: center;
    }
    .btn-primary:hover:not(:disabled) { background: #f5c040; }

    .btn-vote {
      background: var(--surface2);
      border: 0.5px solid var(--border);
      transition: border-color 0.15s, background 0.15s;
    }
    .btn-vote:hover:not(:disabled) { border-color: var(--gold-border); background: var(--gold-bg); }

    /* ── Divider ────────────────────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 14px 0; font-size: 12px; color: var(--muted);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 0.5px; background: var(--border);
    }

    /* ── Room Code ──────────────────────────────────────────────────── */

      text-align: center;

      background: var(--gold-bg);
      border: 0.5px solid var(--gold-border);

      letter-spacing: 10px;

      font-size: 12px; padding: 0; margin-left: 6px;

      text-transform: uppercase; color: var(--gold); opacity: 0.7;

    /* ── Toggle ─────────────────────────────────────────────────────── */

      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      cursor: pointer; user-select: none;
      transition: background 0.15s;

    .toggle-row:hover { background: var(--surface2); }
    .toggle-track {

      background: var(--border2); position: relative; flex-shrink: 0;
      transition: background 0.2s;
    }
    .toggle-track.on { background: var(--gold); }
    .toggle-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: white; position: absolute; top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .toggle-track.on .toggle-thumb { transform: translateX(16px); }

    /* ── Role Card ──────────────────────────────────────────────────── */
    .role-card {
      text-align: center; padding: 24px 16px;
      border-radius: var(--radius); margin-bottom: 16px;

    .role-player { background: var(--green-bg); border: 0.5px solid var(--green-border); }
    .role-emoji { font-size: 28px; margin-bottom: 8px; }
    .role-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
    .role-label-red { color: var(--red); }
    .role-label-green { color: var(--green); }
    .role-word { font-size: 32px; font-weight: 600; margin-bottom: 6px; }
    .role-sub { font-size: 13px; color: var(--muted); }

    /* ── Hint Box ───────────────────────────────────────────────────── */
    .hint-box {
      margin-top: 14px; padding: 12px 14px; text-align: left;
      background: var(--gold-bg); border: 0.5px solid var(--gold-border);
      border-radius: var(--radius-sm);
    }
    .hint-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
    .hint-value { font-size: 14px; font-style: italic; color: var(--text); }

    /* ── Turn Order ─────────────────────────────────────────────────── */
    .order-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px; font-size: 14px;

    .order-row.me { border-color: var(--blue-border); background: var(--blue-bg); }
    .order-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--surface2); border: 0.5px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; flex-shrink: 0;

    /* ── Vote / Results ─────────────────────────────────────────────── */
    .result-banner {
      text-align: center; padding: 24px 16px;
      border-radius: var(--radius); margin-bottom: 16px;
    }
    .result-win { background: var(--green-bg); border: 0.5px solid var(--green-border); }
    .result-lose { background: var(--red-bg); border: 0.5px solid var(--red-border); }
    .result-icon { font-size: 32px; margin-bottom: 8px; }
    .result-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }

    .vote-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 12px; border-radius: var(--radius-sm);
      margin-bottom: 4px; font-size: 14px;

    .vote-count { font-weight: 600; color: var(--gold); }

    .config-warning {
      background: var(--red-bg); border: 1px solid var(--red-border);
      border-radius: var(--radius); padding: 20px; text-align: center;
      margin-top: 24px;

    .config-warning h3 { color: var(--red); margin-bottom: 8px; }

    .config-warning code { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); }

function uid()    { return Math.random().toString(36).slice(2, 14); }
function mkCode() { return Math.random().toString(36).slice(2, 7).toUpperCase(); }
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Legge il codice stanza dall'URL (?room=AB3K9)
function getRoomFromURL() {
  return new URLSearchParams(window.location.search).get("room") || "";
}

// Aggiorna l'URL con il codice stanza (senza ricaricare la pagina)
function setRoomInURL(code) {
  const url = new URL(window.location.href);
  if (code) url.searchParams.set("room", code);
  else url.searchParams.delete("room");
  window.history.replaceState({}, "", url.toString());
}

// ── Firebase DB helpers ───────────────────────────────────────────────────────
function normalizeRoom(data) {
  if (!data) return null;
  if (data.players && !Array.isArray(data.players))
    data.players = Object.values(data.players);
  if (data.turnOrder && !Array.isArray(data.turnOrder))
    data.turnOrder = Object.values(data.turnOrder);
  if (!data.votes || Array.isArray(data.votes))
    data.votes = {};
  return data;
}

async function saveRoom(code, data) {
  await db.ref(`rooms/${code}`).set(data);
}

async function loadRoomOnce(code) {
  const snap = await db.ref(`rooms/${code}`).once("value");
  return snap.exists() ? normalizeRoom(snap.val()) : null;
}

function subscribeRoom(code, callback) {
  const ref = db.ref(`rooms/${code}`);
  ref.on("value", snap => { if (snap.exists()) callback(normalizeRoom(snap.val())); });
  return () => ref.off("value");
}

const { useState, useEffect, useRef } = React;

function App() {
  const [pid]          = useState(uid);
  const [nick, setNick]           = useState("");
  const [joinInput, setJoinInput] = useState(getRoomFromURL());
  const [roomCode, setRoomCode]   = useState("");
  const [gs, setGs]               = useState(null);
  const [error, setError]         = useState("");
  const [loading, setLoading]     = useState(false);
  const [copied, setCopied]       = useState(false);
  const unsubRef = useRef(null);

  // Sottoscrivi aggiornamenti Firebase quando si entra in una stanza
  useEffect(() => {
    if (!roomCode || !IS_CONFIGURED) return;
    unsubRef.current = subscribeRoom(roomCode, setGs);
    return () => { if (unsubRef.current) unsubRef.current(); };
  }, [roomCode]);

  if (!IS_CONFIGURED) {
    return (
      <div className="config-warning">
        <h3>⚠️ Firebase non configurato</h3>
        <p>Apri <code>index.html</code> e inserisci i tuoi valori Firebase nella sezione <code>firebaseConfig</code> in cima al file.</p>
        <p style={{marginTop:8}}>Leggi il <code>README.md</code> per le istruzioni passo-passo.</p>
      </div>
    );
  }

  // Stato derivato
  const phase    = gs?.phase || "home";
  const screen   = !roomCode ? "home"
    : !gs         ? "loading"
    : phase === "lobby"   ? "lobby"
    : phase === "playing" ? "game"
    : phase === "voting"  ? "voting"
    : "results";

  const me             = gs?.players?.find(p => p.id === pid);
  const isHost         = me?.isHost;
  const amImp          = gs?.impostorId === pid;
  const orderedPlayers = (gs?.turnOrder || []).map(id => gs.players.find(p => p.id === id)).filter(Boolean);
  const votes          = gs?.votes || {};
  const hasVoted       = !!votes[pid];
  const voteCount      = Object.values(votes).reduce((acc, id) => { acc[id] = (acc[id] || 0) + 1; return acc; }, {});
  const mostVotedId    = Object.entries(voteCount).sort((a, b) => b[1] - a[1])[0]?.[0];
  const impostorCaught = mostVotedId === gs?.impostorId;
  const impostorPlayer = gs?.players?.find(p => p.id === gs?.impostorId);

  // ── Azioni ────────────────────────────────────────────────────────────────
  async function handleCreate() {
    if (!nick.trim()) { setError("Inserisci un nickname!"); return; }
    setLoading(true); setError("");
    const code = mkCode();
    const state = {
      phase: "lobby",
      players: [{ id: pid, name: nick.trim(), isHost: true }],
      hostId: pid, hintEnabled: false,
      word: null, impostorId: null, turnOrder: [], votes: {},
    };
    await saveRoom(code, state);
    setRoomCode(code);
    setRoomInURL(code);
    setLoading(false);
  }

  async function handleJoin() {
    if (!nick.trim()) { setError("Inserisci un nickname!"); return; }
    const code = joinInput.trim().toUpperCase();
    if (!code) { setError("Inserisci il codice stanza!"); return; }
    setLoading(true); setError("");
    const state = await loadRoomOnce(code);
    if (!state) { setError("Stanza non trovata!"); setLoading(false); return; }
    if (state.phase !== "lobby") { setError("La partita è già iniziata!"); setLoading(false); return; }
    if (!state.players.find(p => p.id === pid)) {
      state.players.push({ id: pid, name: nick.trim(), isHost: false });
      await saveRoom(code, state);
    }
    setRoomCode(code);
    setRoomInURL(code);
    setLoading(false);
  }

  async function handleToggleHint() {
    const state = await loadRoomOnce(roomCode);
    state.hintEnabled = !state.hintEnabled;
    await saveRoom(roomCode, state);
  }

  async function handleStart() {
    if (gs.players.length < 2) { setError("Servono almeno 2 giocatori!"); return; }
    const state = await loadRoomOnce(roomCode);
    const word  = rnd(WORDS);
    const imp   = rnd(state.players);
    const turnOrder = shuffle(state.players).map(p => p.id);
    Object.assign(state, { phase: "playing", word, impostorId: imp.id, turnOrder, votes: {} });
    await saveRoom(roomCode, state);
  }

  async function handleGoVoting() {
    const state = await loadRoomOnce(roomCode);
    state.phase = "voting";
    await saveRoom(roomCode, state);
  }

  async function handleVote(targetId) {
    const state = await loadRoomOnce(roomCode);
    if (state.votes[pid]) return;
    state.votes[pid] = targetId;
    if (Object.keys(state.votes).length >= state.players.length) state.phase = "results";
    await saveRoom(roomCode, state);
  }

  async function handleRestart() {
    const state = await loadRoomOnce(roomCode);
    Object.assign(state, { phase: "lobby", word: null, impostorId: null, turnOrder: [], votes: {} });
    await saveRoom(roomCode, state);
  }

  function copyLink() {
    const url = new URL(window.location.href);
    url.searchParams.set("room", roomCode);
    navigator.clipboard?.writeText(url.toString()).catch(() => {});
    setCopied(true); setTimeout(() => setCopied(false), 1800);
  }

  // ── Render ────────────────────────────────────────────────────────────────
  return (
    <div>

      {/* ── LOADING ──────────────────────────────────────────────────────── */}
      {screen === "loading" && (
        <div className="card" style={{marginTop: 32, textAlign: "center"}}>
          <p className="muted">Connessione in corso…</p>
        </div>
      )}

      {/* ── HOME ─────────────────────────────────────────────────────────── */}
      {screen === "home" && (
        <div className="card" style={{marginTop: 32}}>
          <div className="card-top" />
          <h1>L'Impostore</h1>
          <p className="muted" style={{marginBottom: 24}}>Gioca con gli amici in chat vocale — l'app gestisce ruoli e votazioni</p>
          <input type="text" placeholder="Il tuo nickname"
            value={nick} onChange={e => setNick(e.target.value)}
            onKeyDown={e => e.key === "Enter" && handleCreate()} />
          {error && <div className="error-msg">{error}</div>}
          <button className="btn btn-primary" onClick={handleCreate} disabled={loading}>
            {loading ? "Caricamento…" : "Crea Stanza"}
          </button>
          <div className="divider">oppure entra in una stanza esistente</div>
          <input type="text" placeholder="Codice stanza (es. AB3K9)"
            value={joinInput} onChange={e => setJoinInput(e.target.value.toUpperCase())}
            onKeyDown={e => e.key === "Enter" && handleJoin()} />
          <button className="btn" onClick={handleJoin} disabled={loading}>Unisciti</button>
        </div>
      )}

      {/* ── LOBBY ────────────────────────────────────────────────────────── */}
      {screen === "lobby" && (
        <div className="card" style={{marginTop: 24}}>
          <div className="card-top" />
          <div className="code-box">
            <div className="label">Codice Stanza</div>
            <div className="code-big">{roomCode}</div>
            <div className="muted" style={{fontSize: 12}}>
              Condividi il link con gli amici
              <button className="copy-btn" onClick={copyLink}>
                {copied ? "✓ copiato!" : "— copia link"}
              </button>
            </div>
          </div>

          <h2>Giocatori ({gs?.players?.length})</h2>
          {gs?.players?.map(p => (
            <div key={p.id} className="player-row">
              <div className="dot" />
              <span>{p.name}{p.id === pid ? " (tu)" : ""}</span>
              {p.isHost && <span className="badge-host">Host</span>}
            </div>
          ))}

          <div style={{marginTop: 16}}>
            <div className="label">Opzioni</div>
            <div className="toggle-row" onClick={isHost ? handleToggleHint : undefined}
              style={{cursor: isHost ? "pointer" : "default"}}>
              <div>
                <div style={{fontSize: 14, fontWeight: 500}}>Indizio all'impostore</div>
                <div className="muted" style={{fontSize: 12, marginTop: 2}}>
                  L'impostore riceve un suggerimento molto vago sulla parola
                </div>
              </div>
              <div className={`toggle-track${gs?.hintEnabled ? " on" : ""}`}>
                <div className="toggle-thumb" />
              </div>
            </div>
          </div>

          {!isHost && gs?.hintEnabled && (
            <div className="info-banner">Opzione attiva: l'impostore riceverà un indizio vago</div>
          )}

          {error && <div className="error-msg" style={{marginTop: 8}}>{error}</div>}

          <div style={{marginTop: 16}}>
            {isHost ? (
              <button className="btn btn-primary" onClick={handleStart}
                disabled={gs?.players?.length < 2}>
                {gs?.players?.length < 2 ? "Aspetta altri giocatori…" : "Inizia Partita"}
              </button>
            ) : (
              <p className="waiting">In attesa che l'host avvii la partita…</p>
            )}
          </div>
        </div>
      )}

      {/* ── GAME ─────────────────────────────────────────────────────────── */}
      {screen === "game" && (
        <>
          <div className="card" style={{marginTop: 24}}>
            <div className="card-top" />
            <div className={`role-card ${amImp ? "role-impostor" : "role-player"}`}>
              <div className="role-emoji">{amImp ? "🕵️" : "✅"}</div>
              {amImp ? (
                <>
                  <div className="role-label role-label-red">Sei l'impostore</div>
                  <div className="role-word" style={{color: "var(--red)"}}>???</div>
                  <div className="role-sub">Non conosci la parola. Cerca di capirla dagli indizi!</div>
                  {gs.hintEnabled && WORD_HINTS[gs.word] && (
                    <div className="hint-box">
                      <div className="hint-label">Indizio vago</div>
                      <div className="hint-value">"{WORD_HINTS[gs.word]}"</div>
                    </div>
                  )}
                </>
              ) : (
                <>
                  <div className="role-label role-label-green">La parola segreta è</div>
                  <div className="role-word" style={{color: "var(--green)"}}>{gs.word}</div>
                  <div className="role-sub">Dai un indizio a voce senza rivelarla — c'è un impostore tra voi!</div>
                </>
              )}
            </div>
          </div>

          <div className="card">
            <div className="label">Ordine di turno (casuale)</div>
            {orderedPlayers.map((p, i) => (
              <div key={p.id} className={`order-row${p.id === pid ? " me" : ""}`}>
                <div className="order-num">{i + 1}</div>
                <span style={{flex: 1}}>{p.name}{p.id === pid ? " (tu)" : ""}</span>
              </div>
            ))}
            <p className="muted" style={{marginTop: 10, fontSize: 12}}>
              Parlate in quest'ordine su Discord, poi l'host avvia la votazione.
            </p>
          </div>

          {isHost ? (
            <div className="card" style={{marginBottom: 0}}>
              <button className="btn btn-primary" onClick={handleGoVoting}>
                Tutti hanno parlato → Vota
              </button>
            </div>
          ) : (
            <p className="waiting">In attesa che l'host avvii la votazione…</p>
          )}
        </>
      )}

      {/* ── VOTING ───────────────────────────────────────────────────────── */}
      {screen === "voting" && (
        <div className="card" style={{marginTop: 24}}>
          <div className="card-top" />
          <h2>Chi è l'impostore?</h2>
          <p className="muted" style={{marginBottom: 16}}>
            Discutete su Discord, poi ognuno vota qui.
          </p>
          {!hasVoted ? (
            <>
              <div className="label">Vota il tuo sospettato:</div>
              {gs.players.filter(p => p.id !== pid).map(p => (
                <button key={p.id} className="btn btn-vote" onClick={() => handleVote(p.id)}>
                  {p.name}
                </button>
              ))}
            </>
          ) : (
            <p className="waiting">
              Voto inviato! In attesa degli altri… ({Object.keys(votes).length}/{gs.players.length})
            </p>
          )}
        </div>
      )}

      {/* ── RESULTS ──────────────────────────────────────────────────────── */}
      {screen === "results" && (
        <>
          <div className="card" style={{marginTop: 24}}>
            <div className="card-top" />
            <div className={`result-banner ${impostorCaught ? "result-win" : "result-lose"}`}>
              <div className="result-icon">{impostorCaught ? "🎉" : "😈"}</div>
              <div className="result-title">
                {impostorCaught ? "Impostore smascherato!" : "L'impostore ha vinto!"}
              </div>
              <p style={{fontSize: 14, color: "var(--muted)", marginTop: 6}}>
                L'impostore era <strong style={{color: "var(--text)"}}>{impostorPlayer?.name}</strong>
                {" — "} la parola era <strong style={{color: "var(--gold)"}}>{gs.word}</strong>
              </p>
            </div>

            <div className="label">Riepilogo voti</div>
            {gs.players.map(p => (
              <div key={p.id} className={`vote-row${p.id === gs.impostorId ? " imp-row" : ""}`}>
                <span>{p.name}{p.id === gs.impostorId ? " 🕵️" : ""}</span>
                <span className="vote-count">{voteCount[p.id] || 0} voti</span>
              </div>
            ))}
          </div>

          <div className="card" style={{marginBottom: 0}}>
            {isHost ? (
              <button className="btn btn-primary" onClick={handleRestart}>
                Nuova Partita
              </button>
            ) : (
              <p className="waiting">In attesa che l'host avvii una nuova partita…</p>
            )}
          </div>
        </>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
